<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zj71's Game Hub</title>
  <meta name="description" content="Play games, chat, and more — one hub for everything.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23d9a441'/%3E%3Cpath d='M30 40h40a14 14 0 0 1 14 14v6a12 12 0 0 1-21 8l-2-2H39l-2 2a12 12 0 0 1-21-8v-6a14 14 0 0 1 14-14z' fill='%230b0c0e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9h12a4 4 0 0 1 4 4v3a3 3 0 0 1-5.2 2L15 16.5H9L7.2 18A3 3 0 0 1 2 16v-3a4 4 0 0 1 4-4z"/>
          <path d="M8 12v2.5M6.8 13.2h2.4"/>
          <circle cx="15.5" cy="12.4" r=".6" fill="currentColor"/>
          <circle cx="17.5" cy="14.2" r=".6" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>zj71's Game Hub</h1>
        <p id="gameCount">Loading games…</p>
      </div>
    </div>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false" aria-label="Search games">
        <kbd>/</kbd>
      </div>

      <nav class="chips" id="chips" aria-label="Filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="favorites">Favorites</button>
        <button class="chip" data-filter="recent">Recent</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="button-container" id="grid"></div>
  </main>

  <footer class="site-footer">
    press <kbd>/</kbd> to search &middot; <kbd>Esc</kbd> to clear
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
