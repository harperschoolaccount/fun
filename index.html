<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zj71's Game Hub</title>
  <meta name="description" content="Play games, chat, and more — one hub for everything.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <div class="logo">🎮</div>
      <div class="brand-text">
        <h1>zj71's <span class="grad">Game&nbsp;Hub</span></h1>
        <p id="gameCount">Loading games…</p>
      </div>
    </div>

    <div class="controls">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="searchInput" type="search" placeholder="Search games…" autocomplete="off" spellcheck="false" aria-label="Search games">
        <kbd>/</kbd>
      </div>

      <nav class="chips" id="chips" aria-label="Filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="favorites">★ Favorites</button>
        <button class="chip" data-filter="recent">🕘 Recent</button>
      </nav>
    </div>
  </header>

  <main>
    <div class="button-container" id="grid"></div>
  </main>

  <footer class="site-footer">
    Made with 💜 — press <kbd>/</kbd> to search, <kbd>Esc</kbd> to clear
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
