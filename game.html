<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading… — zj71's Game Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23d9a441'/%3E%3Cpath d='M30 40h40a14 14 0 0 1 14 14v6a12 12 0 0 1-21 8l-2-2H39l-2 2a12 12 0 0 1-21-8v-6a14 14 0 0 1 14-14z' fill='%230b0c0e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="game-page">
  <div class="topbar" id="topbar">
    <button class="tb-btn primary" id="backBtn" title="Back to hub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5m6-6-6 6 6 6"/>
      </svg>
      <span>Hub</span>
    </button>
    <div class="tb-title" id="gameTitle">Loading…</div>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="reloadBtn" title="Reload game">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>
      </svg>
      <span class="opt-label">Reload</span>
    </button>
    <button class="tb-btn" id="fullscreenBtn" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <span class="opt-label">Fullscreen</span>
    </button>
    <button class="tb-btn tb-close" id="hideBarBtn" title="Hide toolbar (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18"/>
      </svg>
    </button>
  </div>

  <button class="tb-float" id="showBarBtn" title="Show toolbar (H)">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  </button>

  <iframe id="gameFrame" class="game-frame" src="about:blank"
          allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>

  <script src="script.js"></script>
</body>
</html>
