<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading… — zj71's Game Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E▶%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="game-page">
  <div class="topbar" id="topbar">
    <button class="tb-btn primary" id="backBtn" title="Back to hub">← <span>Hub</span></button>
    <div class="tb-title" id="gameTitle">Loading…</div>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="reloadBtn" title="Reload game">⟳ <span class="opt-label">Reload</span></button>
    <button class="tb-btn" id="infoBtn" title="Toggle device info panel">ⓘ <span class="opt-label">Info</span></button>
    <button class="tb-btn" id="fullscreenBtn" title="Fullscreen (F)">⛶ <span class="opt-label">Fullscreen</span></button>
    <button class="tb-btn tb-close" id="hideBarBtn" title="Hide toolbar (H)">✕</button>
  </div>

  <button class="tb-float" id="showBarBtn" title="Show toolbar (H)">▼</button>

  <iframe id="gameFrame" class="game-frame" src="about:blank"
          allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>

  <div id="deviceWatermark" class="device-watermark hidden">Initializing…</div>

  <script src="script.js"></script>
</body>
</html>
